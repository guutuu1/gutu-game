<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gutu Game</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #0b1020;
  color: white;
  min-height: 100vh;
}

.header {
  background: #121a2e;
  padding: 18px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #26314d;
}

.logo {
  font-size: 22px;
  font-weight: bold;
}

.balance {
  background: #1d2945;
  padding: 9px 13px;
  border-radius: 20px;
  font-weight: bold;
}

.container {
  max-width: 500px;
  margin: auto;
  padding: 20px 15px 40px;
}

.welcome {
  margin: 10px 0 20px;
}

.welcome h1 {
  font-size: 28px;
  margin-bottom: 6px;
}

.welcome p {
  color: #9ca8c2;
}

.game-card {
  background: #121a2e;
  border: 1px solid #26314d;
  border-radius: 20px;
  padding: 25px 18px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,.25);
}

.game-icon {
  font-size: 65px;
  margin-bottom: 10px;
}

.game-card h2 {
  margin-bottom: 8px;
}

.game-card p {
  color: #9ca8c2;
  margin-bottom: 20px;
}

.result {
  min-height: 80px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #0b1020;
  border-radius: 15px;
  margin-bottom: 18px;
  padding: 15px;
  font-size: 22px;
  font-weight: bold;
}

.play-btn {
  width: 100%;
  border: none;
  border-radius: 15px;
  padding: 17px;
  font-size: 20px;
  font-weight: bold;
  background: #20c878;
  color: white;
  cursor: pointer;
}

.play-btn:active {
  transform: scale(.98);
}

.play-btn:disabled {
  opacity: .6;
}

.cost {
  margin-top: 12px;
  color: #9ca8c2;
  font-size: 14px;
}

.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 18px;
}

.stat {
  background: #121a2e;
  border: 1px solid #26314d;
  border-radius: 15px;
  padding: 16px;
}

.stat span {
  display: block;
  color: #8e9ab3;
  font-size: 13px;
  margin-bottom: 7px;
}

.stat strong {
  font-size: 20px;
}

.history {
  margin-top: 22px;
  background: #121a2e;
  border: 1px solid #26314d;
  border-radius: 18px;
  padding: 18px;
}

.history h3 {
  margin-bottom: 12px;
}

.history-item {
  display: flex;
  justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px solid #26314d;
}

.history-item:last-child {
  border-bottom: none;
}

.win {
  color: #20c878;
}

.loss {
  color: #ff5c70;
}

.empty {
  color: #8e9ab3;
  font-size: 14px;
}

.footer {
  text-align: center;
  color: #66728c;
  font-size: 12px;
  margin-top: 25px;
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">🎮 Gutu Game</div>
  <div class="balance">🪙 <span id="balance">1000</span></div>
</header>

<main class="container">

  <section class="welcome">
    <h1>One Tap. One Chance.</h1>
    <p>Play with virtual coins and see your result instantly.</p>
  </section>

  <section class="game-card">

    <div class="game-icon">🎰</div>

    <h2>Lucky Tap</h2>

    <p>Tap PLAY and test your luck.</p>

    <div class="result" id="result">
      Ready to play?
    </div>

    <button class="play-btn" id="playBtn" onclick="playGame()">
      PLAY
    </button>

    <div class="cost">
      Cost per play: 🪙 50 coins
    </div>

  </section>

  <section class="stats">

    <div class="stat">
      <span>Total Plays</span>
      <strong id="plays">0</strong>
    </div>

    <div class="stat">
      <span>Wins</span>
      <strong id="wins">0</strong>
    </div>

  </section>

  <section class="history">

    <h3>Recent Plays</h3>

    <div id="history">
      <div class="empty">Your plays will appear here.</div>
    </div>

  </section>

  <div class="footer">
    Demo game • Virtual coins only
  </div>

</main>

<script>

let balance = 1000;
let plays = 0;
let wins = 0;

const playCost = 50;

function playGame() {

  if (balance < playCost) {
    document.getElementById("result").textContent =
      "Not enough virtual coins.";
    return;
  }

  const button = document.getElementById("playBtn");

  button.disabled = true;
  button.textContent = "PLAYING...";

  balance -= playCost;
  plays++;

  document.getElementById("balance").textContent = balance;
  document.getElementById("plays").textContent = plays;

  document.getElementById("result").textContent = "🎲 Rolling...";

  setTimeout(function() {

    const random = Math.random();
    let prize = 0;

    if (random < 0.08) {
      prize = 500;
    } else if (random < 0.20) {
      prize = 200;
    } else if (random < 0.40) {
      prize = 100;
    }

    if (prize > 0) {

      balance += prize;
      wins++;

      document.getElementById("result").innerHTML =
        "🎉 YOU WIN<br>+🪙 " + prize;

      document.getElementById("wins").textContent = wins;

      addHistory("WIN +" + prize, true);

    } else {

      document.getElementById("result").textContent =
        "😔 No prize this time";

      addHistory("LOSS -50", false);
    }

    document.getElementById("balance").textContent = balance;

    button.disabled = false;
    button.textContent = "PLAY";

  }, 700);
}

function addHistory(text, isWin) {

  const history = document.getElementById("history");

  const empty = history.querySelector(".empty");

  if (empty) {
    empty.remove();
  }

  const item = document.createElement("div");

  item.className = "history-item";

  item.innerHTML =
    "<span>🎮 Lucky Tap</span>" +
    "<strong class='" + (isWin ? "win" : "loss") + "'>" +
    text +
    "</strong>";

  history.prepend(item);

  if (history.children.length > 10) {
    history.removeChild(history.lastChild);
  }
}

</script>

</body>
  </html>
