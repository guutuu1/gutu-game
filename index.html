<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gutu Game</title><style>body{font-family:Arial;background:#090d14;color:#fff;margin:0;padding:20px}main{max-width:650px;margin:auto}.card{background:#141c29;padding:20px;border-radius:16px;margin:12px 0}input,button{width:100%;padding:13px;margin:6px 0;border-radius:10px;border:0}button{background:#7357ff;color:#fff;font-weight:bold}.muted{color:#9eabbc}.admin{background:#202b3c}</style></head><body><main><div class="card"><h1>🎮 Gutu Game</h1><p class="muted">Production starter</p><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button onclick="register()">Register</button><button onclick="login()">Login</button><button class="admin" onclick="adminLogin()">Admin Login</button><p id="msg"></p></div><div id="out" class="card"></div></main><script>
async function call(url,method="GET",body){let o={method,headers:{"Content-Type":"application/json"}};if(localStorage.token)o.headers.Authorization="Bearer "+localStorage.token;if(body)o.body=JSON.stringify(body);let r=await fetch(url,o),d=await r.json();if(!r.ok)throw Error(d.error);return d}
async function register(){try{await call("/api/register","POST",{username:u.value,password:p.value});msg.textContent="Account created. Now login."}catch(e){msg.textContent=e.message}}
async function login(){try{let d=await call("/api/login","POST",{username:u.value,password:p.value});localStorage.token=d.token;show()}catch(e){msg.textContent=e.message}}
async function adminLogin(){try{let d=await call("/api/admin/login","POST",{username:u.value,password:p.value});localStorage.token=d.token;out.innerHTML="<h2>👑 Admin</h2><button onclick='users()'>Users</button><button onclick='ledger()'>Ledger</button><button onclick='games()'>Game records</button><button onclick='audit()'>Audit log</button>"}catch(e){msg.textContent=e.message}}
async function show(){let d=await call("/api/me");out.innerHTML="<h2>Welcome "+d.user.username+"</h2><p>Balance: "+d.wallet.balance+"</p><p class=muted>Real-money play is not activated.</p>"}
async function users(){let d=await call("/api/admin/users");out.innerHTML="<h2>Users</h2>"+d.users.map(x=>"<p>"+x.id+" — "+x.username+" — "+x.status+"</p>").join("")}
async function ledger(){let d=await call("/api/admin/ledger");out.innerHTML="<h2>Ledger</h2>"+d.rows.map(x=>"<p>"+x.user_id+" · "+x.type+" · "+x.amount+"</p>").join("")}
async function games(){let d=await call("/api/admin/games");out.innerHTML="<h2>Games</h2>"+d.rows.map(x=>"<p>"+x.game+" · stake "+x.stake+" · payout "+x.payout+"</p>").join("")}
async function audit(){let d=await call("/api/admin/audit");out.innerHTML="<h2>Audit</h2>"+d.rows.map(x=>"<p>"+x.admin+" · "+x.action+" · "+x.details+"</p>").join("")}
</script></body></html>
