<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gutu Game</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
min-height:100vh;
background:radial-gradient(circle at top,#8a6500,#050505 60%);
color:white;
}

.header{
text-align:center;
padding:25px 15px;
}

.logo{
font-size:34px;
font-weight:bold;
color:#ffd700;
text-shadow:0 0 10px #ffd700,0 0 25px #b8860b;
}

.container{
max-width:450px;
margin:auto;
padding:15px;
}

.welcome-card{

background:
linear-gradient(
145deg,
rgba(255,215,0,.18),
rgba(10,10,10,.95)
);

border:1px solid #c79a00;
border-radius:25px;
padding:35px 20px;
text-align:center;

box-shadow:0 0 30px rgba(255,215,0,.25);

}

.chicken{
font-size:85px;
margin-bottom:15px;
}

.welcome-card h1{
font-size:30px;
color:#ffd700;
margin-bottom:15px;
}

.welcome-card p{
color:#ddd;
line-height:1.6;
}


.features{

display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:25px;

}


.feature{

background:#111;
border:1px solid #806000;
border-radius:15px;
padding:15px 5px;
font-size:25px;

}


.feature span{

display:block;
font-size:12px;
color:#ccc;
margin-top:8px;

}



.auth-box{

margin-top:25px;
background:#111;
border:1px solid #c79a00;
border-radius:20px;
padding:25px;

box-shadow:0 0 20px rgba(255,215,0,.15);

}


.auth-box h2{

text-align:center;
color:#ffd700;
margin-bottom:20px;

}



input{

width:100%;
padding:14px;
margin:8px 0;
border-radius:10px;
border:none;
font-size:16px;

}


button{

width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:10px;
font-weight:bold;
font-size:16px;
cursor:pointer;

}


.signup-btn{

background:#333;
color:white;

}


.login-btn{

background:#ffd700;
color:black;

}


.forgot-btn{

background:#222;
color:#ffd700;
border:1px solid #ffd700;

}


.message{

text-align:center;
margin-top:15px;
color:#ffd700;

}


.footer{

text-align:center;
color:#888;
font-size:12px;
margin:25px;

}

</style>

</head>


<body>


<header class="header">

<div class="logo">
🐔 GUTU GAME
</div>

</header>


<div class="container">


<section class="welcome-card">

<div class="chicken">
🐔
</div>


<h1>
Welcome to Gutu Game
</h1>


<p>
Play exciting games with a premium experience.
Secure wallet and smooth gameplay.
</p>



<div class="features">


<div class="feature">
🎮
<span>Games</span>
</div>


<div class="feature">
💰
<span>Wallet</span>
</div>


<div class="feature">
⚡
<span>Fast</span>
</div>


</div>

</section>



<section class="auth-box" id="loginBox">

<h2>
🔐 Gutu Game Login
</h2>


<input id="email" type="email" placeholder="Enter email">


<input id="password" type="password" placeholder="Enter password">


<button class="signup-btn" id="signupBtn">
SIGN UP
</button>


<button class="login-btn" id="loginBtn">
LOGIN
</button>


<button class="forgot-btn" id="forgotBtn">
FORGOT PASSWORD
</button>


<p class="message" id="authMessage"></p>


</section>



<section class="auth-box" id="resetBox" style="display:none;">

<h2>
🔑 Reset Password
</h2>


<input id="newPassword" type="password" placeholder="New password">


<input id="confirmPassword" type="password" placeholder="Confirm password">


<button class="login-btn" id="updatePasswordBtn">
UPDATE PASSWORD
</button>


<p class="message" id="resetMessage"></p>


</section>



<div class="footer">

Gutu Game © 2026

</div>


      </div>
      <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://mkmrmpkeigrwbnbsfzqm.supabase.co";


const SUPABASE_KEY =
"sb_publishable_29l1O6k0suVDtgrwTDpEYw_SBeY4nIN";


const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



const message =
document.getElementById("authMessage");



/* SIGN UP */

document
.getElementById("signupBtn")
.onclick = async()=>{


const email =
document.getElementById("email").value.trim();


const password =
document.getElementById("password").value;



if(!email || !password){

message.textContent =
"Enter email and password";

return;

}



const {error} =
await supabaseClient.auth.signUp({

email,
password

});



if(error){

message.textContent =
"❌ " + error.message;

}
else{

message.textContent =
"✅ Account created. Check your email to confirm.";

}


};





/* LOGIN */

document
.getElementById("loginBtn")
.onclick = async()=>{


const email =
document.getElementById("email").value.trim();


const password =
document.getElementById("password").value;



const {error} =
await supabaseClient.auth.signInWithPassword({

email,
password

});



if(error){

message.textContent =
"❌ " + error.message;

}

else{


message.textContent =
"✅ Login successful";


setTimeout(()=>{

window.location.href =
"chicken.html";

},1000);


}


};





/* FORGOT PASSWORD */

document
.getElementById("forgotBtn")
.onclick = async()=>{


const email =
document.getElementById("email").value.trim();



if(!email){

message.textContent =
"Enter your email first";

return;

}



const {error} =
await supabaseClient.auth.resetPasswordForEmail(

email,

{

redirectTo:
"https://gutu-game.onrender.com/"

}

);



if(error){

message.textContent =
"❌ " + error.message;

}

else{

message.textContent =
"✅ Check your email for reset link";

}


};





/* UPDATE PASSWORD */

document
.getElementById("updatePasswordBtn")
.onclick = async()=>{


const password =
document.getElementById("newPassword").value;


const confirm =
document.getElementById("confirmPassword").value;


const resetMessage =
document.getElementById("resetMessage");



if(password !== confirm){

resetMessage.textContent =
"❌ Passwords do not match";

return;

}



const {error} =
await supabaseClient.auth.updateUser({

password:password

});



if(error){

resetMessage.textContent =
"❌ " + error.message;

}

else{

resetMessage.textContent =
"✅ Password updated successfully";

}


};





/* PASSWORD RECOVERY DETECTION */

supabaseClient.auth
.onAuthStateChange(

(event)=>{


if(event === "PASSWORD_RECOVERY"){


document
.getElementById("resetBox")
.style.display="block";


document
.getElementById("loginBox")
.style.display="none";


}


}

);


</script>


</body>

</html>
