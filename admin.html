<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gutu Game - Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  font-family: sans-serif;
  background: #0f172a;
  color: white;
  padding: 15px;
  margin: 0;
}

h1 {
  color: #f59e0b;
}

.table-container {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: #1e293b;
  min-width: 600px;
}

th, td {
  padding: 10px;
  border-bottom: 1px solid #334155;
  text-align: left;
}

th {
  background: #334155;
}

button {
  padding: 8px 12px;
  border: none;
  border-radius: 5px;
  font-weight: bold;
  cursor: pointer;
}

.refresh {
  background: #2563eb;
  color: white;
}

.approve {
  background: #22c55e;
  color: white;
}

.reject {
  background: #ef4444;
  color: white;
}

.status-pending {
  color: orange;
  font-weight: bold;
}

.status-completed {
  color: #22c55e;
  font-weight: bold;
}

.status-rejected {
  color: red;
  font-weight: bold;
}
</style>

</head>

<body>

<h1>🛡️ Gutu Game Admin</h1>

<button class="refresh" onclick="loadWithdrawals()">
🔄 Refresh
</button>


<div class="table-container">

<table>

<thead>
<tr>
<th>Date</th>
<th>Amount</th>
<th>Method</th>
<th>Account</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>


<tbody id="withdrawalTable">

<tr>
<td colspan="6">
Loading...
</td>
</tr>

</tbody>


</table>

</div>


<script>

const SUPABASE_URL =
"https://mkmrmpkeigrwbnbsfzqm.supabase.co";


const SUPABASE_ANON_KEY =
"sb_publishable_29l1O6k0suVDtgrwTDpEYw_SBeY4nIN";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);



async function loadWithdrawals(){

const table =
document.getElementById(
"withdrawalTable"
);


table.innerHTML =
"<tr><td colspan='6'>Loading...</td></tr>";



const {
data,
error
}
=
await supabaseClient
.from("withdrawals")
.select("*")
.order(
"created_at",
{
ascending:false
}
);



if(error){

table.innerHTML =
`
<tr>
<td colspan="6">
${error.message}
</td>
</tr>
`;

return;

}



if(!data || data.length===0){

table.innerHTML =
`
<tr>
<td colspan="6">
No withdrawals found
</td>
</tr>
`;

return;

}



table.innerHTML =
data.map(
(w)=>
`

<tr>

<td>
${new Date(w.created_at)
.toLocaleString()}
</td>


<td>
<b>${w.amount} ETB</b>
</td>


<td>
${w.method}
</td>


<td>
${w.account_details}
</td>


<td class="status-${w.status}">
${w.status.toUpperCase()}
</td>



<td>

${
w.status==="pending"

?

`

<button
class="approve"
onclick="updateStatus('${w.id}','completed')">

Approve

</button>


<button
class="reject"
onclick="rejectWithdrawal('${w.id}','${w.user_id}',${w.amount})">

Reject

</button>

`

:

"Done"

}

</td>


</tr>


`

).join("");

}




async function updateStatus(id,status){


if(!confirm(
"Approve this withdrawal?"
))
return;



const {
error
}
=
await supabaseClient
.from("withdrawals")
.update({
status:status
})
.eq(
"id",
id
);



if(error){

alert(
error.message
);

return;

}


alert(
"Withdrawal approved!"
);


loadWithdrawals();


}





async function rejectWithdrawal(
id,
userId,
amount
){


if(!confirm(
"Reject and refund this withdrawal?"
))
return;



const {
error
}
=
await supabaseClient
.from("withdrawals")
.update({
status:"rejected"
})
.eq(
"id",
id
);



if(error){

alert(error.message);

return;

}



const {
error:refundError
}
=
await supabaseClient.rpc(
"increment_balance",
{
p_user_id:userId,
p_amount:amount
}
);



if(refundError){

alert(
"Rejected but refund failed: "
+
refundError.message
);

}

else{

alert(
"Withdrawal rejected and refunded"
);

}



loadWithdrawals();


}



loadWithdrawals();


</script>

</body>
</html>
