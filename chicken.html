<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gutu Chicken Game</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #0b1020;
  color: white;
  text-align: center;
  min-height: 100vh;
}

header {
  background: #121a2e;
  padding: 18px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #26314d;
}

.logo {
  font-size: 22px;
  font-weight: bold;
}

.balance-box {
  background: #1d2945;
  padding: 8px 16px;
  border-radius: 20px;
  font-weight: bold;
  font-size: 16px;
}

.container {
  max-width: 450px;
  margin: 20px auto;
  padding: 15px;
}

.game-box,
.wallet-box {
  background: #121a2e;
  border: 1px solid #26314d;
  border-radius: 20px;
  padding: 25px 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,.35);
  margin-bottom: 20px;
}

.chicken {
  font-size: 80px;
  margin: 15px 0;
}

.multiplier {
  font-size: 42px;
  font-weight: bold;
  color: #20c878;
  margin: 15px 0;
}

.status {
  color: #9ca8c2;
  font-size: 15px;
  margin-bottom: 20px;
}

input,
select {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: 1px solid #26314d;
  background: #0b1020;
  color: white;
  font-size: 16px;
  text-align: center;
  margin-bottom: 15px;
  outline: none;
}

button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 12px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  margin-bottom: 10px;
  transition: opacity 0.2s;
}

button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.start-btn {
  background: #f5b400;
  color: #111;
}

.cashout-btn {
  background: #20c878;
  color: white;
}

.deposit-btn {
  background: #0088cc;
  color: white;
}

.withdraw-btn {
  background: #e63946;
  color: white;
}

.logout-btn {
  background: #252c3b;
  color: #9ca8c2;
  font-size: 14px;
  padding: 10px;
  margin-top: 15px;
}

.result {
  margin-top: 15px;
  font-size: 16px;
  min-height: 24px;
  font-weight: bold;
}

.tabs {
  display: flex;
  margin-bottom: 15px;
  gap: 10px;
}

.tab-btn {
  flex: 1;
  background: #1d2945;
  color: white;
  padding: 10px;
  font-size: 14px;
  border-radius: 8px;
}

.tab-btn.active {
  background: #20c878;
}

.tab-content {
  display: none;
}

.tab-content.active {
  display: block;
}
</style>
</head>

<body>

<header>
  <div class="logo">🐔 Gutu Game</div>
  <div class="balance-box">
    💰 <span id="balance">0.00</span> ETB
  </div>
</header>

<div class="container">

  <!-- GAME SECTION -->
  <div class="game-box">

    <div class="chicken">🐔</div>

    <div class="multiplier" id="multiplier">
      1.00x
    </div>

    <div class="status" id="status">
      Enter bet and press START
    </div>

    <input
      type="number"
      id="betAmount"
      placeholder="Bet Amount (ETB)"
      min="1"
      step="1"
      value="10"
    >

    <button
      class="start-btn"
      id="startBtn"
      type="button"
    >
      START GAME
    </button>

    <button
      class="cashout-btn"
      id="cashoutBtn"
      type="button"
      disabled
    >
      CASH OUT
    </button>

    <div class="result" id="result"></div>

  </div>


  <!-- WALLET SECTION -->
  <div class="wallet-box">

    <h3>💳 Wallet & Payments</h3>

    <br>

    <div class="tabs">

      <button
        class="tab-btn active"
        id="tabDepBtn"
        type="button"
      >
        Deposit
      </button>

      <button
        class="tab-btn"
        id="tabWithBtn"
        type="button"
      >
        Withdraw
      </button>

    </div>


    <!-- DEPOSIT FORM -->
    <div
      class="tab-content active"
      id="depositTab"
    >

      <input
        type="number"
        id="depAmount"
        placeholder="Deposit Amount (ETB)"
        min="10"
        value="50"
      >

      <select id="depMethod">

        <option value="Telebirr">
          Telebirr / Chapa
        </option>

        <option value="CBE Birr">
          CBE Birr
        </option>

      </select>

      <button
        class="deposit-btn"
        id="depositBtn"
        type="button"
      >
        PROCEED TO DEPOSIT
      </button>

    </div>


    <!-- WITHDRAW FORM -->
    <div
      class="tab-content"
      id="withdrawTab"
    >

      <input
        type="number"
        id="withAmount"
        placeholder="Withdraw Amount (ETB)"
        min="50"
      >

      <input
        type="text"
        id="withAccount"
        placeholder="Telebirr Phone Number / Account"
        inputmode="tel"
        autocomplete="tel"
      >

      <select id="withMethod">

        <option value="Telebirr">
          Telebirr
        </option>

        <option value="CBE">
          CBE Bank
        </option>

      </select>

      <button
        class="withdraw-btn"
        id="withdrawBtn"
        type="button"
      >
        REQUEST WITHDRAWAL
      </button>

    </div>


    <div
      class="result"
      id="walletResult"
    ></div>


    <button
      class="logout-btn"
      id="logoutBtn"
      type="button"
    >
      Log Out
    </button>

  </div>

</div>


<!-- SUPABASE SDK -->

<script>

const SUPABASE_URL =
  "https://mkmrmpkeigrwbnbsfzqm.supabase.co";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let currentCrashMultiplier = 1.00;

let isPlaying = false;


/* ================================
   FETCH USER BALANCE
================================ */

async function fetchUserBalance(userId) {

  const { data, error } =
    await supabaseClient
      .from("profiles")
      .select("balance")
      .eq("id", userId)
      .single();

  if (error) {

    console.error(
      "Error fetching balance:",
      error.message
    );

  } else if (data) {

    document.getElementById("balance").innerText =
      Number(data.balance).toFixed(2);

  }
}


/* ================================
   LOAD BALANCE
================================ */

async function loadBalance() {

  const {
    data: { session }
  } = await supabaseClient.auth.getSession();

  if (!session) {

    window.location.href = "index.html";
    return;

  }


  /* Check Chapa transaction reference */

  const urlParams =
    new URLSearchParams(window.location.search);

  const txRef =
    urlParams.get("tx_ref") ||
    urlParams.get("trx_ref");


  if (txRef) {

    document.getElementById("walletResult").innerText =
      "Verifying deposit...";


    try {

      const res =
        await fetch(
          `${SUPABASE_URL}/functions/v1/clever-task`,
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
              "Authorization":
                `Bearer ${session.access_token}`
            },

            body: JSON.stringify({
              tx_ref: txRef
            })
          }
        );


      const resData =
        await res.json();


      if (res.ok) {

        document.getElementById(
          "walletResult"
        ).innerText =
          "✅ Deposit successful!";

      } else {

        document.getElementById(
          "walletResult"
        ).innerText =
          "❌ " +
          (
            resData.message ||
            "Verification failed"
          );

      }

    } catch (err) {

      console.error(
        "Verification error:",
        err
      );

    }


    window.history.replaceState(
      {},
      document.title,
      window.location.pathname
    );

  }


  await fetchUserBalance(
    session.user.id
  );

}


/* ================================
   START GAME
================================ */
