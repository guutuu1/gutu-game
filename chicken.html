<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gutu Chicken Game</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #0b1020;
  color: white;
  text-align: center;
  min-height: 100vh;
}

header {
  background: #121a2e;
  padding: 18px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #26314d;
}

.logo {
  font-size: 22px;
  font-weight: bold;
}

.balance-box {
  background: #1d2945;
  padding: 8px 16px;
  border-radius: 20px;
  font-weight: bold;
  font-size: 16px;
}

.container {
  max-width: 450px;
  margin: 20px auto;
  padding: 15px;
}

.game-box, .wallet-box {
  background: #121a2e;
  border: 1px solid #26314d;
  border-radius: 20px;
  padding: 25px 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,.35);
  margin-bottom: 20px;
}

.chicken {
  font-size: 80px;
  margin: 15px 0;
}

.multiplier {
  font-size: 42px;
  font-weight: bold;
  color: #20c878;
  margin: 15px 0;
}

.status {
  color: #9ca8c2;
  font-size: 15px;
  margin-bottom: 20px;
}

input, select {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: 1px solid #26314d;
  background: #0b1020;
  color: white;
  font-size: 16px;
  text-align: center;
  margin-bottom: 15px;
  outline: none;
}

button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 12px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  margin-bottom: 10px;
  transition: opacity 0.2s;
}

button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.start-btn { background: #f5b400; color: #111; }
.cashout-btn { background: #20c878; color: white; }
.deposit-btn { background: #0088cc; color: white; }
.withdraw-btn { background: #e63946; color: white; }
.logout-btn { background: #252c3b; color: #9ca8c2; font-size: 14px; padding: 10px; margin-top: 15px; }

.result {
  margin-top: 15px;
  font-size: 16px;
  min-height: 24px;
  font-weight: bold;
}

.tabs {
  display: flex;
  margin-bottom: 15px;
  gap: 10px;
}

.tab-btn {
  flex: 1;
  background: #1d2945;
  color: white;
  padding: 10px;
  font-size: 14px;
  border-radius: 8px;
}

.tab-btn.active {
  background: #20c878;
}

.tab-content {
  display: none;
}

.tab-content.active {
  display: block;
}
</style>
</head>

<body>

<header>
  <div class="logo">🐔 Gutu Game</div>
  <div class="balance-box">💰 <span id="balance">0.00</span> ETB</div>
</header>

<div class="container">
  <!-- GAME SECTION -->
  <div class="game-box">
    <div class="chicken">🐔</div>
    <div class="multiplier" id="multiplier">1.00x</div>
    <div class="status" id="status">Enter bet and press START</div>

    <input type="number" id="betAmount" placeholder="Bet Amount (ETB)" min="1" step="1" value="10">

    <button class="start-btn" id="startBtn">START GAME</button>
    <button class="cashout-btn" id="cashoutBtn" disabled>CASH OUT</button>

    <div class="result" id="result"></div>
  </div>

  <!-- WALLET SECTION -->
  <div class="wallet-box">
    <h3>💳 Wallet & Payments</h3>
    <br>
    <div class="tabs">
      <button class="tab-btn active" id="tabDepBtn">Deposit</button>
      <button class="tab-btn" id="tabWithBtn">Withdraw</button>
    </div>

    <!-- DEPOSIT FORM -->
    <div class="tab-content active" id="depositTab">
      <input type="number" id="depAmount" placeholder="Deposit Amount (ETB)" min="10" value="50">
      <select id="depMethod">
        <option value="Telebirr">Telebirr / Chapa</option>
        <option value="CBE Birr">CBE Birr</option>
      </select>
      <button class="deposit-btn" id="depositBtn">PROCEED TO DEPOSIT</button>
    </div>

    <!-- WITHDRAW FORM -->
    <div class="tab-content" id="withdrawTab">
      <input type="number" id="withAmount" placeholder="Withdraw Amount (ETB)" min="50">
      <input type="text" id="withAccount" placeholder="Phone Number / Account">
      <select id="withMethod">
        <option value="Telebirr">Telebirr</option>
        <option value="CBE">CBE Bank</option>
      </select>
      <button class="withdraw-btn" id="withdrawBtn">REQUEST WITHDRAWAL</button>
    </div>

    <div class="result" id="walletResult"></div>
    <button class="logout-btn" id="logoutBtn">Log Out</button>
  </div>
</div>

<!-- SUPABASE SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://mkmrmpkeigrwbnbsfzqm.supabase.co";
const SUPABASE_KEY = "sb_publishable_29l1O6k0suVDtgrwTDpEYw_SBeY4nIN";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentBetId = null;
let currentCrashMultiplier = 1.00;
let currentMultiplier = 1.00;
let gameTimer = null;
let isPlaying = false;

// Load user balance from profiles table
async function loadBalance() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  
  if (!session) {
    window.location.href = "index.html";
    return;
  }

  const { data, error } = await supabaseClient
    .from("profiles")
    .select("balance")
    .eq("id", session.user.id)
    .single();

  if (error) {
    console.error("Error fetching balance:", error.message);
  } else if (data) {
    document.getElementById("balance").innerText = Number(data.balance).toFixed(2);
  }
}

// Start Game using Server RPC
async function startGame() {
  if (isPlaying) return;

  const betInput = document.getElementById("betAmount");
  const bet = Number(betInput.value);
  const resultDiv = document.getElementById("result");

  if (!bet || bet <= 0) {
    resultDiv.innerText = "Please enter a valid bet amount.";
    return;
  }

  resultDiv.innerText = "Placing bet on server...";
  document.getElementById("startBtn").disabled = true;

  const { data, error } = await supabaseClient.rpc("place_bet", { bet_amount: bet });

  if (error) {
    resultDiv.innerText = "❌ " + error.message;
    document.getElementById("startBtn").disabled = false;
    return;
  }

  if (data && data.success) {
    currentBetId = data.bet_id;
    currentCrashMultiplier = data.crash_multiplier;
    document.getElementById("balance").innerText = Number(data.new_balance).toFixed(2);

    isPlaying = true;
    currentMultiplier = 1.00;
    document.getElementById("cashoutBtn").disabled = false;
    document.getElementById("status").innerText = "Game running...";
    resultDiv.innerText = "";

    gameTimer = setInterval(function() {
      currentMultiplier += 0.03;
      document.getElementById("multiplier").innerText = currentMultiplier.toFixed(2) + "x";

      if (currentMultiplier >= currentCrashMultiplier) {
        handleCrash();
      }
    }, 150);
  }
}

// Handle Crash Event
function handleCrash() {
  if (gameTimer) { clearInterval(gameTimer); gameTimer = null; }
  isPlaying = false;

  document.getElementById("startBtn").disabled = false;
  document.getElementById("cashoutBtn").disabled = true;
  document.getElementById("status").innerText = "💥 CRASHED!";
  document.getElementById("result").innerText = "Game crashed at " + currentCrashMultiplier.toFixed(2) + "x";
}

// Cash Out using Server RPC
async function cashOut() {
  if (!isPlaying || !currentBetId) return;

  if (gameTimer) { clearInterval(gameTimer); gameTimer = null; }
  isPlaying = false;

  document.getElementById("cashoutBtn").disabled = true;
  document.getElementById("status").innerText = "Cashing out...";

  const cashedMultiplier = Number(currentMultiplier.toFixed(2));

  const { data, error } = await supabaseClient.rpc("cash_out", {
    p_bet_id: currentBetId,
    cashed_multiplier: cashedMultiplier
  });

  document.getElementById("startBtn").disabled = false;

  if (error) {
    document.getElementById("result").innerText = "❌ " + error.message;
    return;
  }

  if (data && data.success) {
    document.getElementById("balance").innerText = Number(data.new_balance).toFixed(2);
    document.getElementById("status").innerText = "🎉 Cashed Out!";
    document.getElementById("result").innerText = "Won " + Number(data.payout).toFixed(2) + " ETB at " + cashedMultiplier + "x!";
  } else {
    document.getElementById("status").innerText = "💥 Crashed!";
    document.getElementById("result").innerText = data.message || "Crashed before cashout.";
    if (data.new_balance !== undefined) {
      document.getElementById("balance").innerText = Number(data.new_balance).toFixed(2);
    }
  }
}

// Handle Deposit via Chapa Edge Function
async function handleDeposit() {
  const amount = Number(document.getElementById("depAmount").value);
  const method = document.getElementById("depMethod").value;
  const resDiv = document.getElementById("walletResult");

  if (!amount || amount < 10) {
    resDiv.innerText = "Minimum deposit is 10 ETB.";
    return;
  }

  resDiv.innerText = "Redirecting to Chapa checkout...";

  const { data: { session } } = await supabaseClient.auth.getSession();

  if (!session) {
    resDiv.innerText = "❌ Please log in again.";
    return;
  }

  try {
    const response = await fetch(`${SUPABASE_URL}/functions/v1/clever-task`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${session.access_token}`
      },
      body: JSON.stringify({ 
        amount: amount, 
        method: method,
        email: session.user.email,
        user_id: session.user.id,
        return_url: window.location.href
      })
    });

    const resData = await response.json();

    if (resData.checkout_url) {
      window.location.href = resData.checkout_url;
    } else {
      resDiv.innerText = "❌ " + (resData.error || "Deposit initiation failed.");
    }
  } catch (err) {
    resDiv.innerText = "❌ Error: " + err.message;
  }
}

// Handle Withdrawal
async function handleWithdrawal() {
  const amount = Number(document.getElementById("withAmount").value);
  const account = document.getElementById("withAccount").value;
  const method = document.getElementById("withMethod").value;
  const resDiv = document.getElementById("walletResult");

  if (!amount || amount < 50) {
    resDiv.innerText = "Minimum withdrawal is 50 ETB.";
    return;
  }
  if (!account) {
    resDiv.innerText = "Please enter your account/phone number.";
    return;
  }

  resDiv.innerText = "Processing withdrawal...";

  const { data, error } = await supabaseClient.rpc("request_withdrawal", {
    p_amount: amount,
    p_account: account,
    p_method: method
  });

  if (error) {
    resDiv.innerText = "❌ " + error.message;
  } else if (data && data.success) {
    resDiv.innerText = "✅ Withdrawal requested! Admin will review shortly.";
    loadBalance();
  } else {
    resDiv.innerText = "❌ " + (data.message || "Withdrawal failed.");
  }
}

// Log Out
async function logOut() {
  await supabaseClient.auth.signOut();
  window.location.href = "index.html";
}

// UI Tabs Switcher
document.getElementById("tabDepBtn").addEventListener("click", function() {
  document.getElementById("depositTab").classList.add("active");
  document.getElementById("withdrawTab").classList.remove("active");
  this.classList.add("active");
  document.getElementById("tabWithBtn").classList.remove("active");
});

document.getElementById("tabWithBtn").addEventListener("click", function() {
  document.getElementById("withdrawTab").classList.add("active");
  document.getElementById("depositTab").classList.remove("active");
  this.classList.add("active");
  document.getElementById("tabDepBtn").classList.remove("active");
});

document.addEventListener("DOMContentLoaded", function() {
  loadBalance();
  document.getElementById("startBtn").addEventListener("click", startGame);
  document.getElementById("cashoutBtn").addEventListener("click", cashOut);
  document.getElementById("depositBtn").addEventListener("click", handleDeposit);
  document.getElementById("withdrawBtn").addEventListener("click", handleWithdrawal);
  document.getElementById("logoutBtn").addEventListener("click", logOut);
});
</script>

</body>
  </html>
