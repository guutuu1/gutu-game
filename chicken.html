<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gutu Chicken Game</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .balance-box {
      background: #222;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 20px;
    }

    .game-box {
      background: #1b1b1b;
      border-radius: 15px;
      padding: 30px 20px;
      margin-bottom: 20px;
    }

    #multiplier {
      font-size: 55px;
      font-weight: bold;
      margin: 25px 0;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #startBtn {
      background: #22c55e;
      color: white;
    }

    #cashoutBtn {
      background: #f59e0b;
      color: white;
    }

    #depositBtn {
      background: #2563eb;
      color: white;
    }

    #withdrawBtn {
      background: #7c3aed;
      color: white;
    }

    #logoutBtn {
      background: #dc2626;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .section {
      background: #1b1b1b;
      padding: 20px;
      border-radius: 12px;
      margin-top: 20px;
    }

    #status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    .success {
      background: #166534;
      display: block !important;
    }

    .error {
      background: #991b1b;
      display: block !important;
    }

    .info {
      background: #1e40af;
      display: block !important;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🐔 Gutu Chicken Game</h1>

  <div class="balance-box">
    Balance:
    <strong><span id="balance">0.00</span> ETB</strong>
  </div>

  <div class="game-box">

    <div id="multiplier">1.00x</div>

    <input
      type="number"
      id="betAmount"
      value="10"
      min="1"
      step="0.01"
      placeholder="Bet amount"
    >

    <button id="startBtn" onclick="startGame()">
      START GAME
    </button>

    <button id="cashoutBtn" onclick="cashOut()" disabled>
      CASH OUT
    </button>

    <div id="status"></div>

  </div>

  <div class="section">

    <h2>💰 Deposit</h2>

    <input
      type="number"
      id="depositAmount"
      min="1"
      step="0.01"
      placeholder="Deposit amount"
    >

    <button id="depositBtn" onclick="processDeposit()">
      DEPOSIT WITH CHAPA
    </button>

  </div>

  <div class="section">

    <h2>🏦 Withdrawal</h2>

    <input
      type="number"
      id="withdrawAmount"
      min="1"
      step="0.01"
      placeholder="Withdrawal amount"
    >

    <input
      type="text"
      id="withdrawPhone"
      placeholder="Phone number"
    >

    <button id="withdrawBtn" onclick="processWithdrawal()">
      REQUEST WITHDRAWAL
    </button>

  </div>

  <button id="logoutBtn" onclick="logOut()">
    LOG OUT
  </button>

</div>


<script>

  // ==============================
  // SUPABASE
  // ==============================

  const SUPABASE_URL =
    "https://mkmrmpkeigrwbnbsfzqm.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_29l1O6k0suVDtgrwTDpEYw_SBeY4nIN";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  // ==============================
  // GAME VARIABLES
  // ==============================

  let currentUser = null;

  let gameRunning = false;
  let cashedOut = false;

  let gameInterval = null;

  let currentMultiplier = 1.00;
  let crashPoint = 0;

  let bet = 0;


  // ==============================
  // ELEMENTS
  // ==============================

  const balanceElement =
    document.getElementById("balance");

  const multiplierElement =
    document.getElementById("multiplier");

  const betInput =
    document.getElementById("betAmount");

  const startBtn =
    document.getElementById("startBtn");

  const cashoutBtn =
    document.getElementById("cashoutBtn");


  // ==============================
  // STATUS MESSAGE
  // ==============================

  function showStatus(message, type = "info") {

    const status =
      document.getElementById("status");

    status.textContent = message;

    status.className = type;

  }


  // ==============================
  // GET CURRENT USER
  // ==============================

  async function loadUser() {

    const {
      data,
      error
    } = await supabaseClient.auth.getUser();

    if (error || !data.user) {

      window.location.href = "index.html";

      return;

    }

    currentUser = data.user;

    await fetchBalance();

  }


  // ==============================
  // FETCH WALLET BALANCE
  // ==============================

  async function fetchBalance() {

    if (!currentUser) return;

    const {
      data,
      error
    } = await supabaseClient
      .from("wallets")
      .select("balance")
      .eq("user_id", currentUser.id)
      .single();

    if (error) {

      console.error(
        "BALANCE ERROR:",
        error
      );

      showStatus(
        "Could not load balance: " +
        error.message,
        "error"
      );

      return;

    }

    balanceElement.textContent =
      Number(data.balance || 0).toFixed(2);

  }


  // ==============================
  // START GAME
  // ==============================

  async function startGame() {

    if (gameRunning) return;

    if (!currentUser) {

      showStatus(
        "Please login first.",
        "error"
      );

      return;

    }

    const amount =
      Number(betInput.value);

    if (!amount || amount <= 0) {

      showStatus(
        "Enter a valid bet amount.",
        "error"
      );

      return;

    }

    bet = amount;

    // Stop any old interval just in case.
    if (gameInterval) {

      clearInterval(gameInterval);

      gameInterval = null;

    }

    // ==============================
    // PLACE BET
    // ==============================

    const {
      data,
      error
    } = await supabaseClient.rpc(
      "place_bet",
      {
        p_bet_amount: bet
      }
    );

    console.log(
      "PLACE BET RPC DATA:",
      data
    );

    console.log(
      "PLACE BET RPC ERROR:",
      error
    );

    if (error) {

      showStatus(
        "Bet error: " +
        error.message,
        "error"
      );

      await fetchBalance();

      return;

    }


    // ==============================
    // GAME START
    // ==============================

    gameRunning = true;
    cashedOut = false;

    currentMultiplier = 1.00;

    // Random crash point.
    crashPoint =
      Number(
        (
          Math.random() * 3.9 +
          1.1
        ).toFixed(2)
      );

    console.log(
      "Crash point:",
      crashPoint
    );

    multiplierElement.textContent =
      "1.00x";

    startBtn.disabled = true;
    cashoutBtn.disabled = false;
    betInput.disabled = true;

    showStatus(
      "Game started!",
      "info"
    );

    await fetchBalance();


    // ==============================
    // GAME LOOP
    // ==============================

    gameInterval = setInterval(() => {

      // Extra safety:
      // If game stopped, do nothing.
      if (!gameRunning || cashedOut) {

        clearInterval(gameInterval);

        gameInterval = null;

        return;

      }

      currentMultiplier += 0.05;

      currentMultiplier =
        Number(
          currentMultiplier.toFixed(2)
        );

      multiplierElement.textContent =
        currentMultiplier.toFixed(2) +
        "x";


      // ==============================
      // CRASH
      // ==============================

      if (
        currentMultiplier >= crashPoint
      ) {

        clearInterval(gameInterval);

        gameInterval = null;

        endGame(false);

      }

    }, 200);

  }


  // ==============================
  // CASH OUT
  // ==============================

  async function cashOut() {

    if (!gameRunning || cashedOut) {

      return;

    }

    // ==============================
    // STOP GAME IMMEDIATELY
    // ==============================

    cashedOut = true;
    gameRunning = false;

    if (gameInterval) {

      clearInterval(gameInterval);

      gameInterval = null;

    }

    // Save the multiplier at the
    // exact moment CASH OUT was pressed.
    const cashoutMultiplier =
      currentMultiplier;

    const winnings =
      bet * cashoutMultiplier;


    // Disable CASH OUT immediately.
    cashoutBtn.disabled = true;


    // ==============================
    // ADD WINNINGS
    // ==============================

    const {
      data,
      error
    } = await supabaseClient.rpc(
      "increment_balance",
      {
        p_user_id: currentUser.id,
        p_amount: winnings
      }
    );

    console.log(
      "CASHOUT RPC DATA:",
      data
    );

    console.log(
      "CASHOUT RPC ERROR:",
      error
    );


    if (error) {

      showStatus(
        "Cashout error: " +
        error.message,
        "error"
      );

      resetGameUI();

      await fetchBalance();

      return;

    }


    // ==============================
    // SUCCESS
    // ==============================

    showStatus(
      "Cashed out at " +
      cashoutMultiplier.toFixed(2) +
      "x! Won " +
      winnings.toFixed(2) +
      " ETB.",
      "success"
    );

    resetGameUI();

    await fetchBalance();

  }


  // ==============================
  // GAME CRASH
  // ==============================

  function endGame(playerCashedOut) {

    if (playerCashedOut) return;

    gameRunning = false;

    cashedOut = false;

    if (gameInterval) {

      clearInterval(gameInterval);

      gameInterval = null;

    }

    multiplierElement.textContent =
      "💥 " +
      currentMultiplier.toFixed(2) +
      "x";

    showStatus(
      "Game crashed at " +
      currentMultiplier.toFixed(2) +
      "x. Bet lost.",
      "error"
    );

    resetGameUI(false);

    fetchBalance();

  }


  // ==============================
  // RESET GAME UI
  // ==============================

  function resetGameUI(clearMultiplier = true) {

    gameRunning = false;

    cashedOut = false;

    if (gameInterval) {

      clearInterval(gameInterval);

      gameInterval = null;

    }

    startBtn.disabled = false;

    cashoutBtn.disabled = true;

    betInput.disabled = false;

    if (clearMultiplier) {

      currentMultiplier = 1.00;

      multiplierElement.textContent =
        "1.00x";

    }

  }


  // ==============================
  // CHAPA DEPOSIT
  // ==============================

  async function processDeposit() {

    if (!currentUser) {

      showStatus(
        "Please login first.",
        "error"
      );

      return;

    }

    const amount =
      Number(
        document.getElementById(
          "depositAmount"
        ).value
      );

    if (!amount || amount <= 0) {

      showStatus(
        "Enter a valid deposit amount.",
        "error"
      );

      return;

    }

    try {

      const {
        data: sessionData,
        error: sessionError
      } =
        await supabaseClient.auth.getSession();

      if (
        sessionError ||
        !sessionData.session
      ) {

        showStatus(
          "Session expired. Please login again.",
          "error"
        );

        return;

      }

      showStatus(
        "Preparing Chapa payment...",
        "info"
      );


      const response =
        await fetch(
          "/api/chapa/initialize",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json",

              "Authorization":
                "Bearer " +
                sessionData.session
                  .access_token
            },

            body: JSON.stringify({
              amount: amount
            })
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          data.message ||
          "Deposit failed."
        );

      }


      console.log(
        "CHAPA RESPONSE:",
        data
      );


      if (!data.checkout_url) {

        throw new Error(
          "No Chapa checkout URL received."
        );

      }


      showStatus(
        "Redirecting to Chapa...",
        "success"
      );


      window.location.href =
        data.checkout_url;

    } catch (error) {

      console.error(
        "DEPOSIT ERROR:",
        error
      );

      showStatus(
        "Deposit error: " +
        error.message,
        "error"
      );

    }

  }


  // ==============================
  // WITHDRAWAL
  // ==============================

  async function processWithdrawal() {

    if (!currentUser) {

      showStatus(
        "Please login first.",
        "error"
      );

      return;

    }

    const amount =
      Number(
        document.getElementById(
          "withdrawAmount"
        ).value
      );

    const phone =
      document.getElementById(
        "withdrawPhone"
      ).value.trim();


    if (!amount || amount <= 0) {

      showStatus(
        "Enter a valid withdrawal amount.",
        "error"
      );

      return;

    }


    if (!phone) {

      showStatus(
        "Enter your phone number.",
        "error"
      );

      return;

    }


    try {

      const {
        data,
        error
      } = await supabaseClient.rpc(
        "request_withdrawal",
        {
          p_amount: amount,
          p_phone: phone
        }
      );


      console.log(
        "WITHDRAW RPC DATA:",
        data
      );

      console.log(
        "WITHDRAW RPC ERROR:",
        error
      );


      if (error) {

        showStatus(
          "Withdrawal error: " +
          error.message,
          "error"
        );

        await fetchBalance();

        return;

      }


      showStatus(
        "Withdrawal request submitted successfully.",
        "success"
      );


      document.getElementById(
        "withdrawAmount"
      ).value = "";

      document.getElementById(
        "withdrawPhone"
      ).value = "";


      await fetchBalance();

    } catch (error) {

      console.error(
        "WITHDRAWAL ERROR:",
        error
      );

      showStatus(
        "Withdrawal error: " +
        error.message,
        "error"
      );

    }

  }


  // ==============================
  // LOG OUT
  // ==============================

  async function logOut() {

    if (gameInterval) {

      clearInterval(gameInterval);

      gameInterval = null;

    }

    await supabaseClient.auth.signOut();

    window.location.href =
      "index.html";

  }


  // ==============================
  // INITIAL LOAD
  // ==============================

  loadUser();

</script>

</body>
  </html>
