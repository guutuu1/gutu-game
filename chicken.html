<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chicken Game</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #10131a;
  color: white;
  text-align: center;
}

header {
  background: #171b24;
  padding: 18px;
  font-size: 23px;
  font-weight: bold;
}

#balanceBox {
  background: #252c3b;
  padding: 15px;
  margin: 20px 15px;
  border-radius: 12px;
  font-size: 20px;
  font-weight: bold;
}

.game-box {
  margin: 25px 15px;
  padding: 25px 15px;
  background: #1b202b;
  border-radius: 15px;
}

.chicken {
  font-size: 90px;
  margin: 25px 0;
}

.multiplier {
  font-size: 38px;
  font-weight: bold;
  margin: 20px;
}

.status {
  color: #aeb4c0;
  margin-bottom: 20px;
}

input {
  width: 90%;
  max-width: 350px;
  padding: 15px;
  border-radius: 9px;
  border: none;
  font-size: 17px;
  text-align: center;
}

button {
  width: 90%;
  max-width: 350px;
  padding: 15px;
  border: none;
  border-radius: 9px;
  margin: 7px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.start {
  background: #f5b400;
  color: #111;
}

.cashout {
  background: #25b864;
  color: white;
}

.back {
  background: #333946;
  color: white;
}

.result {
  margin-top: 20px;
  font-size: 18px;
  min-height: 25px;
}
</style>
</head>

<body>

<header>
  🐔 Chicken Game
</header>

<div id="testMessage" style="background:red; color:white; padding:15px; margin:10px; font-size:20px;">
  JAVASCRIPT TEST
</div>

<div id="balanceBox">
  💰 Balance: <span id="balance">Loading...</span> ETB
</div>

<div class="game-box">

  <div class="chicken">🐔</div>

  <div class="multiplier" id="multiplier">1.00x</div>

  <div class="status" id="status">Press START to begin</div>

  <div style="margin: 15px 0;">
    <input type="number" id="betAmount" placeholder="Enter bet amount" min="1" step="1">
  </div>

  <button class="start" id="startBtn">START GAME</button>
  <button class="cashout" id="cashoutBtn">CASH OUT</button>
  <button class="back" id="homeBtn">← HOME</button>

  <div class="result" id="result"></div>

</div>

<!-- SUPABASE CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* =========================
   GAME VARIABLES
========================= */
let multiplier = 1.00;
let timer = null;
let playing = false;
let currentBalance = 500.00; // Default starter balance
let currentBet = 0;

// Hide JS test banner when code runs successfully
document.getElementById("testMessage").style.display = "none";

/* =========================
   LOAD BALANCE (LOCAL STORAGE DEMO MODE)
========================= */
function loadBalance() {
  const savedBalance = localStorage.getItem("chicken_game_balance");
  
  if (savedBalance !== null) {
    currentBalance = Number(savedBalance);
  } else {
    currentBalance = 500.00; // Automatically credit 500 ETB for testing
    localStorage.setItem("chicken_game_balance", currentBalance);
  }

  document.getElementById("balance").innerText = currentBalance.toFixed(2);
}

function updateBalance(newAmount) {
  currentBalance = newAmount;
  localStorage.setItem("chicken_game_balance", currentBalance);
  document.getElementById("balance").innerText = currentBalance.toFixed(2);
}

/* =========================
   START GAME
========================= */
function startGame() {
  if (playing) return;

  const betInput = document.getElementById("betAmount");
  const bet = Number(betInput.value);

  if (!bet || bet <= 0) {
    document.getElementById("result").innerText = "Please enter a valid bet amount.";
    return;
  }

  if (bet > currentBalance) {
    document.getElementById("result").innerText = "Insufficient balance! You have " + currentBalance.toFixed(2) + " ETB";
    return;
  }

  currentBet = bet;
  updateBalance(currentBalance - currentBet);

  multiplier = 1.00;
  playing = true;

  document.getElementById("multiplier").innerText = "1.00x";
  document.getElementById("result").innerText = "";
  document.getElementById("status").innerText = "Game running...";

  timer = setInterval(function() {
    multiplier += 0.05;
    document.getElementById("multiplier").innerText = multiplier.toFixed(2) + "x";

    // Random crash chance (~2.5% chance per tick)
    if (Math.random() < 0.025) {
      crashGame();
    }
  }, 300);
}

/* =========================
   CRASH GAME
========================= */
function crashGame() {
  if (timer) {
    clearInterval(timer);
    timer = null;
  }

  playing = false;
  document.getElementById("status").innerText = "The chicken crashed!";
  document.getElementById("result").innerText = "💥 Game crashed at " + multiplier.toFixed(2) + "x. You lost " + currentBet.toFixed(2) + " ETB.";
}

/* =========================
   CASH OUT
========================= */
function cashOut() {
  if (!playing) {
    document.getElementById("result").innerText = "Start a game first.";
    return;
  }

  if (timer) {
    clearInterval(timer);
    timer = null;
  }

  playing = false;

  const totalPayout = currentBet * multiplier;
  updateBalance(currentBalance + totalPayout);

  document.getElementById("status").innerText = "Cashed out!";
  document.getElementById("result").innerText = "🎉 Won " + totalPayout.toFixed(2) + " ETB at " + multiplier.toFixed(2) + "x!";
}

function goHome() {
  window.location.href = "index.html";
}

/* =========================
   INITIALIZATION
========================= */
document.addEventListener("DOMContentLoaded", function() {
  document.getElementById("startBtn").addEventListener("click", startGame);
  document.getElementById("cashoutBtn").addEventListener("click", cashOut);
  document.getElementById("homeBtn").addEventListener("click", goHome);

  loadBalance();
});
</script>

</body>
  </html>
