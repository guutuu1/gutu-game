<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chicken Game</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #10131a;
  color: white;
  text-align: center;
}

header {
  background: #171b24;
  padding: 18px;
  font-size: 23px;
  font-weight: bold;
}

#balanceBox {
  background: #252c3b;
  padding: 15px;
  margin: 20px 15px;
  border-radius: 12px;
  font-size: 20px;
  font-weight: bold;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.game-box {
  margin: 25px 15px;
  padding: 25px 15px;
  background: #1b202b;
  border-radius: 15px;
}

.chicken {
  font-size: 90px;
  margin: 25px 0;
}

.multiplier {
  font-size: 38px;
  font-weight: bold;
  margin: 20px;
}

.status {
  color: #aeb4c0;
  margin-bottom: 20px;
}

input, select {
  width: 90%;
  max-width: 350px;
  padding: 15px;
  border-radius: 9px;
  border: none;
  font-size: 17px;
  text-align: center;
  margin-bottom: 10px;
}

button {
  width: 90%;
  max-width: 350px;
  padding: 15px;
  border: none;
  border-radius: 9px;
  margin: 7px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.start { background: #f5b400; color: #111; }
.cashout { background: #25b864; color: white; }
.withdraw-btn { background: #007bff; color: white; padding: 10px 20px; font-size: 15px; width: auto; }
.back { background: #333946; color: white; }

.result {
  margin-top: 20px;
  font-size: 18px;
  min-height: 25px;
}

/* Modal Overlay */
.modal {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.8);
  justify-content: center;
  align-items: center;
}

.modal-content {
  background: #1b202b;
  padding: 25px;
  border-radius: 15px;
  width: 90%;
  max-width: 400px;
}
</style>
</head>

<body>

<header>
  🐔 Chicken Game
</header>

<div id="balanceBox">
  <div>💰 Balance: <span id="balance">Loading...</span> ETB</div>
  <button class="withdraw-btn" id="openWithdrawModal">💸 Withdraw Funds</button>
</div>

<div class="game-box">
  <div class="chicken">🐔</div>
  <div class="multiplier" id="multiplier">1.00x</div>
  <div class="status" id="status">Press START to begin</div>

  <div style="margin: 15px 0;">
    <input type="number" id="betAmount" placeholder="Enter bet amount" min="1" step="1">
  </div>

  <button class="start" id="startBtn">START GAME</button>
  <button class="cashout" id="cashoutBtn">CASH OUT</button>
  <button class="back" id="homeBtn">← HOME</button>

  <div class="result" id="result"></div>
</div>

<!-- WITHDRAWAL MODAL -->
<div class="modal" id="withdrawModal">
  <div class="modal-content">
    <h3>Withdraw Funds</h3>
    <br>
    <select id="withdrawMethod">
      <option value="Telebirr">Telebirr</option>
      <option value="CBE Birr">CBE Birr</option>
      <option value="Bank Transfer">Bank Transfer</option>
    </select>
    <br>
    <input type="text" id="withdrawAccount" placeholder="Phone or Account Number">
    <br>
    <input type="number" id="withdrawAmount" placeholder="Amount (ETB)" min="10">
    <br>
    <button class="cashout" id="submitWithdraw">Confirm Request</button>
    <button class="back" id="closeWithdrawModal">Cancel</button>
  </div>
</div>

<script>
let multiplier = 1.00;
let timer = null;
let playing = false;
let currentBalance = 500.00;
let currentBet = 0;

function loadBalance() {
  const savedBalance = localStorage.getItem("chicken_game_balance");
  if (savedBalance !== null && !isNaN(Number(savedBalance))) {
    currentBalance = Number(savedBalance);
  } else {
    currentBalance = 500.00;
    localStorage.setItem("chicken_game_balance", currentBalance);
  }
  document.getElementById("balance").innerText = currentBalance.toFixed(2);
}

function updateBalance(newAmount) {
  currentBalance = newAmount;
  localStorage.setItem("chicken_game_balance", currentBalance);
  document.getElementById("balance").innerText = currentBalance.toFixed(2);
}

function startGame() {
  if (playing) return;

  const betInput = document.getElementById("betAmount");
  const bet = Number(betInput.value);

  if (!bet || bet <= 0) {
    document.getElementById("result").innerText = "Please enter a valid bet amount.";
    return;
  }

  if (bet > currentBalance) {
    document.getElementById("result").innerText = "Insufficient balance! You have " + currentBalance.toFixed(2) + " ETB";
    return;
  }

  currentBet = bet;
  updateBalance(currentBalance - currentBet);

  multiplier = 1.00;
  playing = true;

  document.getElementById("startBtn").disabled = true;
  document.getElementById("cashoutBtn").disabled = false;
  document.getElementById("multiplier").innerText = "1.00x";
  document.getElementById("result").innerText = "";
  document.getElementById("status").innerText = "Game running...";

  timer = setInterval(function() {
    multiplier += 0.05;
    document.getElementById("multiplier").innerText = multiplier.toFixed(2) + "x";

    if (Math.random() < 0.03) {
      crashGame();
    }
  }, 250);
}

function crashGame() {
  if (timer) { clearInterval(timer); timer = null; }
  playing = false;
  document.getElementById("startBtn").disabled = false;
  document.getElementById("cashoutBtn").disabled = true;
  document.getElementById("status").innerText = "The chicken crashed!";
  document.getElementById("result").innerText = "💥 Game crashed at " + multiplier.toFixed(2) + "x. You lost " + currentBet.toFixed(2) + " ETB.";
}

function cashOut() {
  if (!playing) return;
  if (timer) { clearInterval(timer); timer = null; }
  playing = false;

  document.getElementById("startBtn").disabled = false;
  document.getElementById("cashoutBtn").disabled = true;

  const totalPayout = currentBet * multiplier;
  updateBalance(currentBalance + totalPayout);

  document.getElementById("status").innerText = "Cashed out!";
  document.getElementById("result").innerText = "🎉 Won " + totalPayout.toFixed(2) + " ETB at " + multiplier.toFixed(2) + "x!";
}

/* =========================
   WITHDRAWAL SYSTEM
========================= */
function handleWithdraw() {
  const method = document.getElementById("withdrawMethod").value;
  const account = document.getElementById("withdrawAccount").value.trim();
  const amount = Number(document.getElementById("withdrawAmount").value);

  if (!account) {
    alert("Please enter a valid account or phone number.");
    return;
  }

  if (!amount || amount <= 0) {
    alert("Please enter a valid withdrawal amount.");
    return;
  }

  if (amount > currentBalance) {
    alert("Insufficient balance for this withdrawal.");
    return;
  }

  // Deduct balance immediately
  updateBalance(currentBalance - amount);

  alert(`Withdrawal request submitted successfully!\n\nAmount: ${amount.toFixed(2)} ETB\nMethod: ${method}\nAccount: ${account}`);

  // Reset & close modal
  document.getElementById("withdrawAccount").value = "";
  document.getElementById("withdrawAmount").value = "";
  document.getElementById("withdrawModal").style.display = "none";
}

document.addEventListener("DOMContentLoaded", function() {
  document.getElementById("startBtn").addEventListener("click", startGame);
  document.getElementById("cashoutBtn").addEventListener("click", cashOut);
  document.getElementById("homeBtn").addEventListener("click", function() { window.location.href = "index.html"; });

  // Modal Controls
  document.getElementById("openWithdrawModal").addEventListener("click", function() {
    document.getElementById("withdrawModal").style.display = "flex";
  });
  document.getElementById("closeWithdrawModal").addEventListener("click", function() {
    document.getElementById("withdrawModal").style.display = "none";
  });
  document.getElementById("submitWithdraw").addEventListener("click", handleWithdraw);

  document.getElementById("cashoutBtn").disabled = true;
  loadBalance();
});
</script>

</body>
</html>
