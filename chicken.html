<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gutu Chicken Game</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #ffffff; margin: 0; padding: 15px; }
    .container { max-width: 500px; margin: 0 auto; background-color: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 12px; margin-bottom: 20px; }
    .balance { font-size: 18px; font-weight: bold; color: #10b981; }
    .multiplier-display { font-size: 48px; font-weight: bold; text-align: center; color: #f59e0b; margin: 20px 0; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.2s; }
    .btn-primary { background-color: #2563eb; color: #ffffff; }
    .btn-success { background-color: #059669; color: #ffffff; }
    .btn-danger { background-color: #dc2626; color: #ffffff; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    input, select { width: 100%; padding: 10px; margin-top: 6px; margin-bottom: 12px; background: #334155; border: 1px solid #475569; border-radius: 6px; color: #fff; font-size: 16px; }
    .tab-group { display: flex; gap: 10px; margin-bottom: 10px; }
    .tab-btn { flex: 1; background: #334155; color: #fff; border: none; padding: 8px; border-radius: 6px; cursor: pointer; }
    .tab-btn.active { background: #2563eb; }
    .hidden { display: none; }
    .status-msg { margin-top: 10px; padding: 8px; border-radius: 6px; text-align: center; font-size: 14px; }
    .status-msg.success { background-color: #064e3b; color: #34d399; }
    .status-msg.error { background-color: #7f1d1d; color: #fca5a5; }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <h2>🐔 Gutu Game</h2>
      <div class="balance">Balance: <span id="userBalance">0.00</span> ETB</div>
    </div>

    <!-- Gameplay View -->
    <div class="multiplier-display" id="multiplier">1.00x</div>
    
    <div id="gameControls">
      <label>Bet Amount (ETB):</label>
      <input type="number" id="betAmount" value="10" min="1" />
      
      <button id="startBtn" class="btn btn-primary" onclick="startGame()">START GAME</button>
      <button id="cashoutBtn" class="btn btn-success hidden" onclick="cashOut()">CASH OUT</button>
    </div>

    <hr style="border-color: #334155; margin: 25px 0;" />

    <!-- Wallet & Payments Section -->
    <h3>💳 Wallet & Payments</h3>
    
    <div class="tab-group">
      <button class="tab-btn active" id="tabDeposit" onclick="switchTab('deposit')">Deposit</button>
      <button class="tab-btn" id="tabWithdraw" onclick="switchTab('withdraw')">Withdraw</button>
    </div>

    <!-- Deposit Form -->
    <div id="depositForm">
      <label>Amount (ETB):</label>
      <input type="number" id="depositAmount" value="50" min="10" />
      <button class="btn btn-primary" onclick="processDeposit()">DEPOSIT VIA CHAPA</button>
    </div>

    <!-- Withdrawal Form -->
    <div id="withdrawForm" class="hidden">
      <label>Amount (ETB):</label>
      <input type="number" id="withdrawAmount" value="50" min="10" />
      
      <label>Account / Phone Number:</label>
      <input type="text" id="withdrawAccount" placeholder="0912345678" />
      
      <label>Payment Method:</label>
      <select id="withdrawMethod">
        <option value="Telebirr">Telebirr</option>
        <option value="CBE Birr">CBE Birr</option>
        <option value="Bank">Bank Transfer</option>
      </select>

      <button class="btn btn-danger" onclick="processWithdrawal()">REQUEST WITHDRAWAL</button>
    </div>

    <div id="statusBox" class="status-msg hidden"></div>

    <button class="btn" style="background:#475569; margin-top:20px;" onclick="logOut()">Log Out</button>
  </div>

  <script>
    // Configuration
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentMultiplier = 1.00;
    let gameInterval = null;
    let isPlaying = false;
    let currentUser = null;

    // Initialize session
    async function initSession() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        currentUser = session.user;
        fetchBalance();
      } else {
        showStatus("Please log in to play.", "error");
      }
    }

    async function fetchBalance() {
      if (!currentUser) return;
      const { data, error } = await supabaseClient
        .from('profiles')
        .select('balance')
        .eq('id', currentUser.id)
        .single();
      
      if (data) {
        document.getElementById('userBalance').innerText = parseFloat(data.balance).toFixed(2);
      }
    }

    function switchTab(tab) {
      if (tab === 'deposit') {
        document.getElementById('depositForm').classList.remove('hidden');
        document.getElementById('withdrawForm').classList.add('hidden');
        document.getElementById('tabDeposit').classList.add('active');
        document.getElementById('tabWithdraw').classList.remove('active');
      } else {
        document.getElementById('depositForm').classList.add('hidden');
        document.getElementById('withdrawForm').classList.remove('hidden');
        document.getElementById('tabWithdraw').classList.add('active');
        document.getElementById('tabDeposit').classList.remove('active');
      }
    }

    function showStatus(msg, type) {
      const box = document.getElementById('statusBox');
      box.innerText = msg;
      box.className = `status-msg ${type}`;
      box.classList.remove('hidden');
    }

    // Gameplay logic
    async function startGame() {
      const bet = parseFloat(document.getElementById('betAmount').value);
      if (isNaN(bet) || bet <= 0) return showStatus("Enter a valid bet amount.", "error");

      // Place bet via RPC
      const { data, error } = await supabaseClient.rpc('place_bet', { p_bet_amount: bet });
      if (error) return showStatus(error.message, "error");

      isPlaying = true;
      currentMultiplier = 1.00;
      fetchBalance();

      document.getElementById('startBtn').classList.add('hidden');
      document.getElementById('cashoutBtn').classList.remove('hidden');

      // Random crash point between 1.1x and 5.0x
      const crashPoint = (Math.random() * 3.9 + 1.1).toFixed(2);

      gameInterval = setInterval(() => {
        currentMultiplier += 0.05;
        document.getElementById('multiplier').innerText = currentMultiplier.toFixed(2) + 'x';

        if (currentMultiplier >= crashPoint) {
          endGame(false);
        }
      }, 200);
    }

    async function cashOut() {
      if (!isPlaying) return;
      clearInterval(gameInterval);
      
      const bet = parseFloat(document.getElementById('betAmount').value);
      const winnings = bet * currentMultiplier;

      // Add winnings back to user profile balance
      const { error } = await supabaseClient.rpc('increment_balance', {
        p_user_id: currentUser.id,
        p_amount: winnings
      });

      if (!error) {
        showStatus(`Cashed out successfully at ${currentMultiplier.toFixed(2)}x! Won ${winnings.toFixed(2)} ETB.`, "success");
      }
      resetGameUI();
      fetchBalance();
    }

    function endGame(won) {
      clearInterval(gameInterval);
      isPlaying = false;
      showStatus("CRASHED! Better luck next time.", "error");
      resetGameUI();
    }

    function resetGameUI() {
      isPlaying = false;
      document.getElementById('startBtn').classList.remove('hidden');
      document.getElementById('cashoutBtn').classList.add('hidden');
    }

    // Deposit Logic
    async function processDeposit() {
      const amount = parseFloat(document.getElementById('depositAmount').value);
      if (isNaN(amount) || amount < 10) return showStatus("Minimum deposit is 10 ETB.", "error");

      // Call Chapa payment initialization edge function or standard endpoint
      showStatus("Redirecting to Chapa...", "success");
      // Add your Chapa payment redirect URL here
    }

    // Withdrawal Logic
    async function processWithdrawal() {
      const amount = parseFloat(document.getElementById('withdrawAmount').value);
      const account = document.getElementById('withdrawAccount').value.trim();
      const method = document.getElementById('withdrawMethod').value;

      if (!amount || amount < 10) return showStatus("Minimum withdrawal is 10 ETB.", "error");
      if (!account) return showStatus("Please enter an account or phone number.", "error");

      const { data, error } = await supabaseClient.rpc('request_withdrawal', {
        p_amount: amount,
        p_account: account,
        p_method: method
      });

      if (error) {
        showStatus(error.message, "error");
      } else {
        showStatus("✅ Withdrawal requested! Admin will review shortly.", "success");
        fetchBalance();
      }
    }

    async function logOut() {
      await supabaseClient.auth.signOut();
      window.location.reload();
    }

    initSession();
  </script>
</body>
  </html>
